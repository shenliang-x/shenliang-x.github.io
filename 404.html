  // Levenshtein edit distance — O(m) space
  function editDistance(a, b) {
    const row = Array.from({ length: b.length + 1 }, (_, i) => i);
    for (let i = 1; i <= a.length; i++) {
      let prev = i;
      for (let j = 1; j <= b.length; j++) {
        const val = a[i - 1] === b[j - 1] ? row[j - 1] : 1 + Math.min(prev, row[j], row[j - 1]);
        row[j - 1] = prev;
        prev = val;
      }
      row[b.length] = prev;
    }
    return row[b.length];
  }

  const norm = (s) => s.toLowerCase().replace(/^\/|\/$/g, '');
  function initSuggestion() {
  const requestedPath = window.location.pathname;
  document.getElementById('requested-path').textContent = requestedPath;

  const r = norm(requestedPath);
  if (!knownRoutes.length) return;
  let best = knownRoutes[0], bestDist = Infinity;
  for (const route of knownRoutes) {
    const d = editDistance(r, norm(route.path));
    if (d < bestDist) { bestDist = d; best = route; }
  }

  const maxLen = Math.max(r.length, norm(best.path).length);
  const normDist = maxLen > 0 ? bestDist / maxLen : 1;
  const hint = document.querySelector('#suggestion .text-xs');
  if (hint) hint.textContent = normDist < 0.5 ? 'Did you mean?' : 'Taking you to the closest page';

  document.getElementById('suggestion-label').textContent = best.label;
  document.getElementById('suggestion-path').textContent = best.path;
  document.getElementById('suggestion-link').href = best.path;
  document.getElementById('suggestion').classList.remove('hidden');

  const cd = document.getElementById('countdown-msg');
  const cancelBtn = document.getElementById('cancel-redirect');
  let t = 5, cancelled = false;

  cd.textContent = `↻ ${t}s`;
  cd.classList.remove('hidden');

  const timer = setInterval(() => {
    if (cancelled) return clearInterval(timer);
    if (--t <= 0) { clearInterval(timer); window.location.href = best.path; }
    else cd.textContent = `↻ ${t}s`;
  }, 1000);

  cancelBtn.addEventListener('click', () => {
    cancelled = true;
    cd.textContent = 'Cancelled';
    cd.classList.replace('text-[var(--color-primary)]', 'text-[var(--color-text-secondary)]');
  });
  }
  initSuggestion();
})();</script>
